name: Build and release

# Every push to main is compiled, tested (Linux x86_64 and arm64, Windows x64) and published as
# a GitHub release with downloadable zips; the release notes list the commits
# since the previous build release. Pushes to ci/** branches build and test
# only, without a release.
on:
  push:
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ xvfb \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libxtst-dev \
            libgl-dev libcurl4-openssl-dev zlib1g-dev

      - name: Check translations
        # Every UI string needs a Japanese and a Korean entry.
        run: python3 scripts/gen_cjk_localization.py --check

      - name: Configure
        # Optimised, but without -DNDEBUG so the tests' asserts stay active.
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE=-O2
          -DPASTEIT_BUILD_TESTS=ON -DPASTEIT_BUILD_DESKTOP=ON -DPASTEIT_VERSION=0.1.${{ github.run_number }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        # Offline suite; X11 probes run against a virtual display.
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          test -x build/pasteit
          mkdir -p dist/pasteit
          cp build/pasteit build/fa-solid-900.ttf build/mermaid.min.js README.md assets/FONTAWESOME_LICENSE.txt dist/pasteit/
          cat > dist/pasteit/pasteit.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=PasteIt
          Comment=Clipboard action popup
          Exec=env PASTEIT_SHOW_ON_START=1 ./pasteit
          Terminal=false
          Categories=Utility;
          EOF
          (cd dist && zip -r pasteit-linux-${{ matrix.arch }}.zip pasteit)

      - name: Package .deb
        # /opt/pasteit with a /usr/bin link, menu entry and icon.
        run: |
          (cd build && cpack -G DEB)
          mv build/pasteit_*.deb dist/pasteit-linux-${{ matrix.arch }}.deb
          dpkg-deb -I dist/pasteit-linux-${{ matrix.arch }}.deb

      - name: Package AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp build/pasteit build/fa-solid-900.ttf build/mermaid.min.js assets/FONTAWESOME_LICENSE.txt AppDir/usr/bin/
          cp assets/pasteit.desktop AppDir/ && cp assets/pasteit.desktop AppDir/usr/share/applications/
          cp assets/pasteit.svg AppDir/ && cp assets/pasteit.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/pasteit" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          machine=$(uname -m)
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${machine}.AppImage"
          chmod +x appimagetool
          ARCH=${machine} ./appimagetool --appimage-extract-and-run AppDir dist/pasteit-linux-${{ matrix.arch }}.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: pasteit-linux-${{ matrix.arch }}
          path: |
            dist/pasteit-linux-${{ matrix.arch }}.zip
            dist/pasteit-linux-${{ matrix.arch }}.deb
            dist/pasteit-linux-${{ matrix.arch }}.AppImage

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # /O2 without /DNDEBUG so the tests' asserts stay active.
        run: >-
          cmake -S . -B build -A x64 "-DCMAKE_CXX_FLAGS_RELEASE=/MD /O2 /Ob2"
          -DPASTEIT_BUILD_TESTS=ON -DPASTEIT_BUILD_DESKTOP=ON -DPASTEIT_VERSION=0.1.${{ github.run_number }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120

      - name: Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter pasteit.exe | Select-Object -First 1
          if (-not $exe) { throw "pasteit.exe was not built" }
          New-Item -ItemType Directory -Force dist/pasteit | Out-Null
          Copy-Item $exe.FullName, assets/fa-solid-900.ttf, assets/mermaid.min.js, README.md, assets/FONTAWESOME_LICENSE.txt dist/pasteit/
          Compress-Archive -Path dist/pasteit -DestinationPath dist/pasteit-windows-x64.zip

      - name: Package installer
        # NSIS installer: Program Files\PasteIt, Start menu entry, uninstaller.
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\NSIS"
          }
          Push-Location build
          cpack -G NSIS -C Release
          Pop-Location
          $setup = Get-ChildItem build -Filter "pasteit-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer was not built" }
          Move-Item $setup.FullName dist/pasteit-windows-x64-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: pasteit-windows-x64
          path: |
            dist/pasteit-windows-x64.zip
            dist/pasteit-windows-x64-setup.exe

  release:
    name: Publish release
    needs: [linux, windows]
    if: ${{ always() && needs.linux.result == 'success' && needs.windows.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history and tags for the incremental notes

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write release notes
        id: notes
        run: |
          python3 scripts/release_notes.py "${GITHUB_SHA}" artifacts > notes.md
          echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.notes.outputs.tag }}" artifacts/* \
            --target "${GITHUB_SHA}" \
            --title "PasteIt ${{ steps.notes.outputs.tag }} (${GITHUB_SHA::7})" \
            --notes-file notes.md \
            --latest
